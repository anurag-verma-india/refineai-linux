[package]
name = "refineai"
version = "0.3.0"
edition = "2021"
description = "Rewrite selected text with Gemini, from a floating popup, anywhere on the Linux desktop."
license = "MIT"

[[bin]]
name = "refineai"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
